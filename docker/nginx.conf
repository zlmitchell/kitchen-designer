server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vite emits hashed filenames, so assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The GLTF/Draco/KTX2 payloads three.js fetches at runtime. nginx:alpine
    # knows none of these, and a wrong Content-Type makes DRACOLoader fail in a
    # way that looks like a corrupt model.
    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json;
        model/gltf-binary                     glb;
        model/gltf+json                       gltf;
        application/wasm                      wasm;
        image/ktx2                            ktx2;
        application/octet-stream              drc bin;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/svg+xml                         svg;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf+json;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

services:
  # Iterate here: `docker compose up dev` -> http://localhost:5173 with HMR.
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./app:/app
      # Keep the image's node_modules; the bind mount above would hide them.
      - /app/node_modules
      # The traced plan, served at /plan by the servePlan() middleware in
      # vite.config.mjs. Deliberately not mounted into public/ - see the comment
      # there. Never baked into an image: it is gitignored personal data that
      # happens to need an HTTP origin.
      - ./data:/plan:ro
    environment:
      - CHOKIDAR_USEPOLLING=true   # bind mounts from Windows do not deliver inotify

  # Check the real build: `docker compose up app` -> http://localhost:8080
  app:
    build:
      context: .
      target: prod
    ports:
      - "8088:80"
    volumes:
      - ./data:/usr/share/nginx/html/plan:ro

  # `docker compose run --rm test`
  #
  # Deliberately WITHOUT the ./app bind mount the dev service uses. Reading
  # many small files across a Windows bind mount is slow enough that
  # tests/asset-integrity.test.js blows vitest's 5s default timeout while
  # walking public/models -- which reads as a failing test and is a slow
  # filesystem. Against the image's own copy the whole suite is ~40% faster and
  # green. data/ is still mounted, so the traced-plan suite runs rather than
  # skipping.
  test:
    build:
      context: .
      target: dev
    volumes:
      - ./data:/plan:ro
    command: npx vitest run
